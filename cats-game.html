<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>貓咪攻城戰</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cats-game.css">
</head>

<body class="game-body">

<canvas id="star-canvas"></canvas>

<div class="cats-game">

<section id="map-screen" class="map-screen">

<header class="map-header">
<a href="games.html" class="map-back">← 返回選單</a>
<h1 class="map-title">關卡選擇</h1>
<div class="map-game-title">貓咪攻城戰</div>
</header>

<main class="world-map">
<div class="temporary-map">

<div class="map-cloud cloud-1"></div>
<div class="map-cloud cloud-2"></div>
<div class="map-cloud cloud-3"></div>

<div class="mountain mountain-1">▲</div>
<div class="mountain mountain-2">▲</div>

<div class="lake lake-1"></div>

<svg class="map-road" viewBox="0 0 1000 600" preserveAspectRatio="none">
<path
d="M 120 470 C 220 420, 240 350, 350 360 C 470 370, 500 470, 610 410 C 710 355, 700 230, 850 180"
fill="none"
stroke="#eee2bd"
stroke-width="9"
stroke-linecap="round"
stroke-dasharray="2 20"
/>

<path
d="M 120 470 C 220 420, 240 350, 350 360 C 470 370, 500 470, 610 410 C 710 355, 700 230, 850 180"
fill="none"
stroke="#7d6b4c"
stroke-width="2"
stroke-linecap="round"
stroke-dasharray="2 20"
/>
</svg>

<div class="map-town town-1">🏠</div>
<div class="map-town town-2">🏡</div>

<div class="map-tree tree-1">🌲</div>
<div class="map-tree tree-2">🌲</div>
<div class="map-tree tree-3">🌳</div>
<div class="map-tree tree-4">🌳</div>

<button class="stage-node stage-1" data-stage="0">
<span class="stage-clear">NEW!</span>
<span class="stage-number">1</span>
<span class="stage-name">第一關</span>
</button>

<button class="stage-node stage-2 locked" data-stage="1">
<span class="stage-clear">LOCK</span>
<span class="stage-number">2</span>
<span class="stage-name">第二關</span>
</button>

<button class="stage-node stage-3 locked" data-stage="2">
<span class="stage-clear">LOCK</span>
<span class="stage-number">3</span>
<span class="stage-name">第三關</span>
</button>

<div class="player-cat">🐱</div>

</div>
</main>

<div class="stage-info" id="stage-info">
<div class="stage-info-title">第一關</div>

<div class="stage-info-line">
<span>敵方基地</span>
<strong id="info-hp">236,000</strong>
</div>

<div class="stage-info-line">
<span>難度</span>
<span id="info-difficulty">★</span>
</div>
</div>

<button id="battle-start" class="battle-start">
<span>戰鬥開始!!</span>
</button>

<nav class="map-bottom">

<button class="bottom-btn" id="my-book-btn">
<span class="bottom-icon">🐱</span>
<span>我方圖鑑</span>
</button>

<button class="bottom-btn" id="enemy-book-btn">
<span class="bottom-icon">👾</span>
<span>敵人圖鑑</span>
</button>

<button class="bottom-btn" id="formation-btn">
<span class="bottom-icon">⚔️</span>
<span>編隊</span>
</button>

<div class="bottom-spacer"></div>

<div class="strategy-club">
<span class="club-icon">📖</span>
<span>攻略社</span>
</div>

</nav>

</section>


<section id="battle-screen" class="battle-screen hidden">

<div class="battle-topbar">

<button id="battle-back" class="battle-back">
← 關卡地圖
</button>

<div id="battle-stage-title" class="battle-stage-title">
第一關
</div>

<button id="battle-pause" class="battle-pause">
Ⅱ
</button>

</div>


<div class="battle-hud">

<div class="base-hud my-hud">
<div class="hud-title">
我方基地
</div>

<div class="hud-hp">
<span id="my-hp-text">1,200,000 / 1,200,000</span>
</div>

<div class="hp-track">
<div id="hp-me" class="hp-fill hp-fill--me"></div>
</div>
</div>


<div class="money-hud">
<span class="money-label">資金</span>
<strong id="money-value">1,869</strong>
</div>


<div class="base-hud enemy-hud">
<div class="hud-title">
敵方基地
</div>

<div class="hud-hp">
<span id="enemy-hp-text">236,000 / 236,000</span>
</div>

<div class="hp-track">
<div id="hp-enemy" class="hp-fill hp-fill--enemy"></div>
</div>
</div>

</div>


<div class="battle-field-wrap">

<canvas
id="battle-canvas"
width="1800"
height="900">
</canvas>

</div>


<div class="deploy-bar">

<div class="money-progress">
<div class="money-progress-fill" id="energy-fill"></div>
</div>

<div class="deploy-buttons">

<button class="unit-card" data-unit="cat1" data-cost="150">
<div class="unit-card-image">
<img src="assets/cat1.svg" alt="小貓兵">
</div>

<div class="unit-card-name">
小貓兵
</div>

<div class="unit-card-cost">
150
</div>

<div class="cooldown-text"></div>
</button>


<button class="unit-card" data-unit="cat2" data-cost="300">
<div class="unit-card-image">
<img src="assets/cat2.svg" alt="戰士貓">
</div>

<div class="unit-card-name">
戰士貓
</div>

<div class="unit-card-cost">
300
</div>

<div class="cooldown-text"></div>
</button>


<button class="unit-card" data-unit="cat3" data-cost="540">
<div class="unit-card-image">
<img src="assets/cat3.svg" alt="重裝貓">
</div>

<div class="unit-card-name">
重裝貓
</div>

<div class="unit-card-cost">
540
</div>

<div class="cooldown-text"></div>
</button>


<button class="unit-card" data-unit="cat4" data-cost="690">
<div class="unit-card-image">
<img src="assets/cat4.svg" alt="炮擊貓">
</div>

<div class="unit-card-name">
炮擊貓
</div>

<div class="unit-card-cost">
690
</div>

<div class="cooldown-text"></div>
</button>


<button class="unit-card" data-unit="cat5" data-cost="950">
<div class="unit-card-image">
<img src="assets/cat5.svg" alt="巨型貓">
</div>

<div class="unit-card-name">
巨型貓
</div>

<div class="unit-card-cost">
950
</div>

<div class="cooldown-text"></div>
</button>

</div>

</div>


<div id="game-message" class="game-message"></div>


<div id="pause-panel" class="pause-panel hidden">

<div class="pause-box">

<h2>遊戲暫停</h2>

<button id="pause-resume">
繼續遊戲
</button>

<button id="pause-exit">
返回地圖
</button>

</div>

</div>

</section>


<div id="menu-overlay" class="menu-overlay hidden">

<div class="menu-panel">

<button id="menu-close" class="menu-close">
×
</button>

<h2 id="menu-title">
我方圖鑑
</h2>

<div id="menu-content" class="menu-content"></div>

</div>

</div>

</div>

<script src="script.js"></script>
<script src="cats-game.js"></script>

</body>
</html>
