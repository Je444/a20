<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貓咪攻城戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cats-game.css">
</head>
<body class="game-body">

  <canvas id="star-canvas"></canvas>

  <div class="game-wrap">
    <div class="game-topbar">
      <a href="games.html" class="hub-back">← 返回選單</a>
      <div class="stage-picker" id="stage-picker"></div>
    </div>

    <div class="hp-bars">
      <div class="hp-block">
        <span class="hp-label">我方基地</span>
        <div class="hp-track"><div class="hp-fill hp-fill--me" id="hp-me"></div></div>
      </div>
      <div class="hp-block">
        <span class="hp-label">敵方基地</span>
        <div class="hp-track"><div class="hp-fill hp-fill--enemy" id="hp-enemy"></div></div>
      </div>
    </div>

    <canvas id="battle-canvas" width="900" height="220"></canvas>

    <div class="deploy-bar">
      <div class="energy-track"><div class="energy-fill" id="energy-fill"></div></div>
      <div class="deploy-buttons">
        <button class="deploy-btn" id="deploy-basic" data-cost="10">
          <span class="deploy-icon">🐱</span>
          <span class="deploy-name">小貓兵</span>
          <span class="deploy-cost">10</span>
        </button>
        <button class="deploy-btn" id="deploy-tank" data-cost="30">
          <span class="deploy-icon">🐈</span>
          <span class="deploy-name">重裝貓</span>
          <span class="deploy-cost">30</span>
        </button>
      </div>
    </div>

    <div class="game-message" id="game-message"></div>
  </div>

  <script src="script.js"></script>
  <script src="cats-game.js"></script>
</body>
</html>
